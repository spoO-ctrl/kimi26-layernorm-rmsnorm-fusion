[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kimi26-rmsnorm-fusion"
version = "0.1.0"
description = "RMSNorm + Linear fusion prototype for Kimi K2.6-style modules"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "transformers>=4.56.2",
]

[tool.setuptools.packages.find]
where = ["src"]
